<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidu vs Seedance 2.0 · 视频效果评测</title>
<style>
  :root{
    --paper:#fdfdfb;
    --ink:#1a1a1a; --ink2:#3f3f3d; --mute:#8c8c86; --faint:#b9b9b2;
    --line:#e7e7e1; --line2:#efefe9;
    --frame:#f4f3ef;
    --accent:#b4441f;               /* 极少量使用的赤陶红 */
    --serif:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .rail{max-width:1040px; margin:0 auto; padding:0 28px}

  /* ---------- Masthead ---------- */
  .masthead{padding:76px 0 30px}
  .eyebrow{
    display:flex; align-items:center; gap:9px;
    font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute);
  }
  .eyebrow::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent)}
  .masthead h1{
    font-family:var(--serif); font-weight:500;
    font-size:clamp(32px,5.4vw,50px); line-height:1.08; letter-spacing:-.005em;
    margin:16px 0 0;
  }
  .masthead h1 .vs{font-style:italic; color:var(--faint); font-size:.62em; margin:0 .22em; font-weight:400}
  .deck{
    font-size:17.5px; line-height:1.62; color:var(--ink2);
    max-width:600px; margin:18px 0 0;
  }
  .byline{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    font-size:13px; color:var(--mute); margin-top:22px;
    padding-top:20px; border-top:1px solid var(--line);
  }
  .byline .sep{color:var(--faint)}

  /* ---------- Row (一组对比) ---------- */
  .rows{padding-bottom:20px}
  .row{padding:44px 0; border-top:1px solid var(--line)}
  .row:first-child{border-top:none; padding-top:30px}
  .row-head{display:flex; gap:20px; align-items:baseline}
  .idx{
    font-family:var(--serif); font-size:26px; color:var(--faint);
    line-height:1; flex:none; min-width:38px; font-variant-numeric:tabular-nums;
  }
  .prompt-block{flex:1; min-width:0}
  .ptag{
    display:block; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--mute); margin-bottom:7px;
  }
  .prompt{
    margin:0; font-size:15.5px; line-height:1.76; color:var(--ink2);
    white-space:pre-wrap; word-break:break-word;
  }

  /* ---------- Pair (双视频) ---------- */
  .pair{
    display:grid; grid-template-columns:1fr 1fr; gap:22px;
    margin-top:26px; margin-left:58px;      /* 与序号对齐缩进 */
  }
  figure.clip{margin:0}
  figcaption{display:flex; align-items:baseline; gap:9px; margin-bottom:10px}
  .name{font-size:14px}
  .name.vidu{color:var(--ink); font-weight:650}
  .name.sd{color:var(--mute); font-weight:500}
  .sub{font-size:12px; color:var(--faint)}
  .frame{
    aspect-ratio:16/9; background:var(--frame);
    border:1px solid var(--line); border-radius:7px; overflow:hidden;
  }
  .frame video{width:100%; height:100%; object-fit:contain; display:block; background:var(--frame)}
  /* 竖版组：改用竖版容器并限高，避免竖屏视频两侧大留白、版面被撑高 */
  .pair.portrait .frame{aspect-ratio:9/16; max-height:560px; width:auto; margin-inline:auto}

  /* ---------- Controls ---------- */
  .ctrl{display:flex; align-items:center; gap:11px; margin-top:16px; margin-left:58px}
  button{font-family:var(--sans); cursor:pointer}
  .b-sync{
    font-size:13px; font-weight:550; color:var(--paper); background:var(--ink);
    border:1px solid var(--ink); border-radius:6px; padding:9px 17px;
    transition:background .15s; min-width:104px;
  }
  .b-sync:hover{background:#000}
  .b-replay{
    font-size:13px; color:var(--ink2); background:transparent;
    border:1px solid #d8d8d1; border-radius:6px; padding:9px 15px; transition:border-color .15s;
  }
  .b-replay:hover{border-color:var(--ink2)}
  .tip{font-size:12.5px; color:var(--faint); margin-left:auto}

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--line); margin-top:10px}
  .foot{padding:34px 0 72px; font-size:13px; color:var(--mute); line-height:1.85}
  .foot b{color:var(--ink2); font-weight:600}

  @media (max-width:760px){
    .rail{padding:0 20px}
    .masthead{padding:52px 0 24px}
    .row-head{gap:14px}
    .idx{min-width:26px; font-size:22px}
    .pair{grid-template-columns:1fr; gap:20px; margin-left:0}
    .ctrl{margin-left:0; flex-wrap:wrap}
    .tip{display:none}
  }
</style>
</head>
<body>
  <header class="masthead rail">
    <div class="eyebrow">模型效果评测 · Model Benchmark</div>
    <h1>Vidu <span class="vs">vs</span> Seedance 2.0</h1>
    <p class="deck">同一段提示词、同一组输入，两款视频模型的直出结果逐组并排。不加解说，让画面自己比。</p>
    <div class="byline">
      <span><b id="b-groups">14</b> 组对比</span><span class="sep">·</span>
      <span><b id="b-videos">28</b> 段视频</span><span class="sep">·</span>
      <span>2026 年 7 月</span>
    </div>
  </header>

  <main class="rail rows" id="app"></main>

  <footer>
    <div class="rail foot">
      <div><b>Vidu vs Seedance 2.0 · 视频效果评测</b></div>
      <div>素材来源：飞书文档《Vidu vs SD 2.0：效果对标，能力更全，价格更优》</div>
      <div id="foot-meta"></div>
    </div>
  </footer>

<script>
const GROUPS = /*__DATA__*/ [];
const app = document.getElementById('app');
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };

GROUPS.forEach(g=>{
  const row = el(`
    <article class="row">
      <div class="row-head">
        <div class="idx">${String(g.id).padStart(2,'0')}</div>
        <div class="prompt-block">
          <span class="ptag">Prompt</span>
          <p class="prompt">${esc(g.prompt)}</p>
        </div>
      </div>
      <div class="pair${g.orient==='portrait'?' portrait':''}">
        <figure class="clip">
          <figcaption><span class="name vidu">Vidu</span><span class="sub">Q3 直出</span></figcaption>
          <div class="frame"><video src="videos/${g.vidu}" preload="none" muted playsinline controls></video></div>
        </figure>
        <figure class="clip">
          <figcaption><span class="name sd">Seedance 2.0</span><span class="sub">对照</span></figcaption>
          <div class="frame"><video src="videos/${g.sd}" preload="none" muted playsinline controls></video></div>
        </figure>
      </div>
      <div class="ctrl">
        <button class="b-sync">▷ 同步播放</button>
        <button class="b-replay">↺ 重播</button>
        <span class="tip">两段从头对齐播放</span>
      </div>
    </article>`);

  const [a,b] = row.querySelectorAll('video');
  const sync = row.querySelector('.b-sync');
  const bothPaused = ()=> a.paused && b.paused;
  const update = ()=> sync.textContent = bothPaused() ? '▷ 同步播放' : '❚❚ 暂停';
  const playBoth = reset => { if(reset){a.currentTime=0;b.currentTime=0;} a.play(); b.play(); };

  sync.addEventListener('click', ()=> bothPaused() ? playBoth(true) : (a.pause(),b.pause()));
  row.querySelector('.b-replay').addEventListener('click', ()=> playBoth(true));
  [a,b].forEach(v=>['play','pause','ended'].forEach(e=>v.addEventListener(e,update)));

  app.appendChild(row);
});

// 滚动到附近才拉首帧，避免一次性请求全部视频
const io = new IntersectionObserver((es)=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.querySelectorAll('video').forEach(v=>v.preload='metadata'); io.unobserve(e.target); }
}), {rootMargin:'500px 0px'});
document.querySelectorAll('.row').forEach(r=>io.observe(r));

document.getElementById('b-groups').textContent = GROUPS.length;
document.getElementById('b-videos').textContent = GROUPS.length*2;
document.getElementById('foot-meta').textContent = `${GROUPS.length} 组 · ${GROUPS.length*2} 段视频 · 生成于 2026-07-01`;
</script>
</body>
</html>
